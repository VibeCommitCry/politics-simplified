# Tried in order. On status 429 or 503 the model cools down for 60 s and the run restarts with the next one.
# A model is only added after passing the Dutch check.
# The part of `name` before the first dash is reported as `provider` in the response.
# `rpm` (optional) is the provider's requests-per-minute limit; calls wait rather than exceed it.
# `options` (optional) is a map of extra arguments sent with every request to that model.
# `api_key_env` is the NAME of the environment variable; the key itself goes in .env.
models:
  - name: groq-gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    rpm: 30                          # 1,000 requests a day
    options:
      max_tokens: 4000
      reasoning_effort: low
  - name: gemini-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    rpm: 5                          # 1,500 requests a day
  - name: NVIDIA-nemotron
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-super-120b-a12b
    api_key_env: NVIDIA_API_KEY
    rpm: 40                          # 10,000 requests a day
