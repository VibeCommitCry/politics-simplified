# Tried in order. On error or rate limit, the whole run restarts with the next model.
# A model is only added after passing the Dutch check.
# The part of `name` before the first dash is reported as `provider` in the response.
# `api_key_env` is the NAME of the environment variable; the key itself goes in .env.
models:
  - name: gemini-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY      # 15 RPM, 1,500 RPD
  - name: groq-gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY        # 30 RPM, 1,000 RPD
  - name: NVIDIA-nemotron
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-super-120b-a12b
    api_key_env: NVIDIA_API_KEY      # 40 requests a minute and 10,000 a day
